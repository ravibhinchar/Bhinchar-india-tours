<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - BhincharIndiaTours</title>
  <link rel="shortcut icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/login.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
</head>

<body>

  <div class="login-container">
    <!-- Background Video -->
    <video autoplay muted loop playsinline class="bg-video">
      <source src="assets/SSvid.net--Rajasthan-from-the-Sky-Cinematic-Aerial-Drone-View_1080p.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>
    <div class="overlay"></div>

    <div class="login-box glass-effect">
      <div class="logo-area">
        <img src="./assets/images/logo.svg" alt="BhincharIndiaTours Logo" class="login-logo">
      </div>

      <h2 class="h2" style="color: var(--white); text-align: center; margin-bottom: 20px;">Welcome Back</h2>

      <form action="#" class="login-form">
        <div class="input-group">
          <ion-icon name="mail-outline"></ion-icon>
          <input type="email" placeholder="Email Address" required class="input-field">
        </div>

        <div class="input-group">
          <ion-icon name="lock-closed-outline"></ion-icon>
          <input type="password" placeholder="Password" required class="input-field">
        </div>

        <div class="options">
          <label class="remember-me">
            <input type="checkbox"> Remember me
          </label>
          <a href="#" class="forgot-pass">Forgot Password?</a>
        </div>

        <button type="submit" class="btn btn-secondary login-btn">Login</button>
      </form>

      <button type="button" id="googleLoginBtn" class="btn btn-google"
        style="margin-top: 15px; background: #fff; color: #333; border: 1px solid #ddd; display: flex; align-items: center; justify-content: center; gap: 10px;">
        <ion-icon name="logo-google"></ion-icon> Sign in with Google
      </button>

      <div class="divider">
        <span>OR</span>
      </div>

      <a href="index.html" class="btn btn-primary skip-btn">
        Skip & Explore as Guest
        <ion-icon name="arrow-forward-outline"></ion-icon>
      </a>

      <p class="signup-link">
        Don't have an account? <a href="register.html">Sign up</a>
      </p>
    </div>
  </div>

  <script src="./assets/js/chat.js"></script>
  <!-- Config -->
  <script src="./assets/js/config.js"></script>
  <script type="module" src="./assets/js/login.js"></script>
</body>

</html>
