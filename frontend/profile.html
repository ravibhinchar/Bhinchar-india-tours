<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Dashboard - BhincharIndiaTours</title>

    <!-- CSS Links -->
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/dashboard.css">
    <link rel="shortcut icon" href="./favicon.svg" type="image/svg+xml">

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
</head>

<body>

    <div class="dashboard-container">
        <!-- Overlay for Mobile Sidebar -->
        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <!-- SIDEBAR -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <a href="index.html">
                    <img src="./assets/images/logo-blue.svg" alt="BhincharIndiaTours" class="sidebar-logo">
                </a>
            </div>

            <ul class="sidebar-menu">
                <li class="menu-item">
                    <a href="#" class="menu-link active">
                        <ion-icon name="grid-outline"></ion-icon>
                        <span>Dashboard</span>
                    </a>
                </li>
                <li class="menu-item">
                    <a href="#" class="menu-link">
                        <ion-icon name="calendar-outline"></ion-icon>
                        <span>My Bookings</span>
                    </a>
                </li>
                <li class="menu-item">
                    <a href="#" class="menu-link">
                        <ion-icon name="settings-outline"></ion-icon>
                        <span>Settings</span>
                    </a>
                </li>
            </ul>

            <div class="sidebar-footer">
                <button id="logoutBtnSide" class="menu-link"
                    style="width: 100%; border: none; background: #fff0f0; color: #ff4d4d; justify-content: start;">
                    <ion-icon name="log-out-outline"></ion-icon>
                    <span>Logout</span>
                </button>
            </div>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="main-content">
            <!-- Top Header -->
            <header class="top-header">
                <div class="mobile-toggle" id="mobileToggle">
                    <ion-icon name="menu-outline"></ion-icon>
                </div>

                <div class="page-title-header mobile-hidden" style="font-weight: 600; color: #333;">
                    Overview
                </div>

                <div class="user-profile">
                    <span style="font-weight: 500;" id="headerName">User</span>
                    <div class="user-avatar">
                        <ion-icon name="person"></ion-icon>
                    </div>
                </div>
            </header>

            <!-- Content Area -->
            <div class="content-wrapper">
                <h1 class="page-title">Welcome back, <span id="userName">User</span>! 👋</h1>

                <div class="dashboard-cards">
                    <!-- Profile Card -->
                    <div class="card">
                        <h3 class="h3" style="margin-bottom: 20px;">Profile Details</h3>
                        <div class="info-row">
                            <span class="info-label">Full Name</span>
                            <span class="info-value" id="displayName">Loading...</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Email</span>
                            <span class="info-value" id="displayEmail">Loading...</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Member Since</span>
                            <span class="info-value">Jan 2025</span>
                        </div>
                    </div>

                    <!-- Bookings Card -->
                    <div class="card">
                        <h3 class="h3" style="margin-bottom: 20px;">Quick Stats</h3>
                        <div class="info-row">
                            <span class="info-label">Total Bookings</span>
                            <span class="info-value" id="bookingCount">0</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Account Status</span>
                            <span class="info-value" style="color: green;">Active</span>
                        </div>
                        <div style="margin-top: 20px;">
                            <a href="index.html#package" class="btn btn-primary"
                                style="width: 100%; justify-content: center; display: flex; text-align: center;">New
                                Booking</a>
                        </div>
                    </div>

                    <!-- Recent Bookings List -->
                    <div class="card" style="grid-column: span 2;">
                        <h3 class="h3" style="margin-bottom: 20px;">Recent Bookings</h3>
                        <div id="bookingsList" style="display: flex; flex-direction: column; gap: 15px;">
                            <p style="color: #666; font-size: 0.9rem;">Loading bookings...</p>
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script src="./assets/js/profile.js"></script>
</body>

</html>
